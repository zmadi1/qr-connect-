---
applications:
  - name: qr-connect
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: npm start
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    timeout: 180
    routes:
      - route: qr-connect-9af4345atrial.cfapps.ap21.hana.ondemand.com
    services:
      - qr-connect-hdi
    env:
      NODE_ENV: production
      # SESSION_SECRET is set with cf set-env. Do not put the secret in this file.
      # Plug SuccessFactors in with cf set-env, using the names in successfactors.env.example.
      # Plug ServiceNow in with cf set-env, using the names in servicenow.env.example.
